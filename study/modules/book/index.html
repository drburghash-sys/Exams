function shuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>b.r-a.r).map(z=>z.x)}
function pick(subj,n){const pool=eligible(subj);if(!pool.length)return[];const latest=Math.max(...pool.map(q=>q.ord)), recent=pool.filter(q=>q.ord===latest), older=pool.filter(q=>q.ord!==latest), seen=new Set(state.seen||[]);const rank=a=>shuffle(a).sort((a,b)=>(seen.has(a.id)?1:0)-(seen.has(b.id)?1:0));const k=Math.min(n,Math.max(1,Math.round(n*.7)));let out=rank(recent).slice(0,k);out.push(...rank(older.filter(q=>!out.includes(q))).slice(0,n-out.length));if(out.length<n)out.push(...rank(pool.filter(q=>!out.includes(q))).slice(0,n-out.length));return shuffle(out).slice(0,n)}

window.setup=function(subj){shell(`<section class="card"><h3>${subj==="math"?"تدريب الرياضيات":"English Practice"}</h3><div class="scope">${esc(scopeTitle(subj))}</div><label>عدد الأسئلة</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><button onclick="start('${subj}',+document.querySelector('#count').value)">ابدأ</button></section>`,"إعداد التدريب")}
window.start=function(subj,n){const qs=pick(subj,n);if(!qs.length)return alert("لا توجد أسئلة مفهرسة ضمن هذا النطاق بعد.");begin(qs,subj==="math"?"رياضيات":"English")}
window.startWeekly=function(){const qs=[...pick("math",10),...pick("english",10)].sort(()=>Math.random()-.5);if(qs.length<2)return alert("لا توجد أسئلة كافية.");begin(qs,"اختبار الأسبوع")}
function begin(qs,title){session={title,questions:qs,index:0,score:0,graded:0};renderQ()}
function source(q){return q.subject==="math"?`كتاب الرياضيات • ص ${toAr(q.page)} • سؤال ${toAr(q.no)}`:`Top Goal 2 • p. ${q.page} • Exercise ${q.no}`}
function display(q){return q.subject==="math"?toAr(q.text):q.text}
function renderQ(){const q=session.questions[session.index],total=session.questions.length;let input="";if(q.type==="choice")input=`<div class="answers">${q.options.map(o=>`<button class="answer" onclick='gradeChoice(${JSON.stringify(o)})'>${q.subject==="math"?toAr(o):esc(o)}</button>`).join("")}</div>`;else if(q.type==="manual")input=`<div class="manual"><p>اكتبي إجابتك قبل مقارنتها بالمرجع. هذا السؤال ذاتي التصحيح.</p><textarea id="writtenReference" placeholder="إجابتك" dir="auto"></textarea><button onclick="showReference()">عرض الإجابة المرجعية</button><div id="ref" class="reference hidden"></div></div>`;else input=`<div class="inputrow"><input id="ans" inputmode="${q.subject==="math"?"decimal":"text"}" autocomplete="off" placeholder="اكتب الإجابة"><button onclick="gradeInput()">تحقق</button></div>`;shell(`<section class="progress"><span style="width:${100*session.index/total}%"></span></section><section class="card question"><div class="row between"><span class="badge">${esc(q.lesson)}</span><span>${toAr(session.index+1)}/${toAr(total)}</span></div><div class="source">${source(q)}</div><div class="qtext ${q.subject==="english"?"ltr":""}">${esc(display(q))}</div>${input}<div id="feedback"></div></section>`,session.title);if($("#ans"))$("#ans").focus()}
function norm(v){let s=toWest(v).replace(/\s+/g,"");let n=Number(s);return Number.isFinite(n)?String(n):s.toLowerCase()}
function rec(q,ok,selected="تقييم ذاتي"){studyRecord({module:"book",subject:q.subject==="math"?"الرياضيات":"الإنجليزي",skill:q.lesson,text:q.text,selected:String(selected),correctText:String(q.answer),correct:ok,manual:q.type==="manual",explanation:source(q)});session.graded++;if(ok)session.score++;state.seen=[...(state.seen||[]),q.id].slice(-120);save()}
window.gradeChoice=function(v){const q=session.questions[session.index],ok=String(v)===String(q.answer);rec(q,ok,v);feedback(ok,q.answer)}
window.gradeInput=function(){const q=session.questions[session.index],raw=$("#ans").value;let ok=q.type==="numeric"?norm(raw)===norm(q.answer):(q.accepted||[q.answer]).map(norm).includes(norm(raw));rec(q,ok,raw);feedback(ok,q.answer)}
function feedback(ok,answer){$("#feedback").innerHTML=`<div class="${ok?"ok":"bad"}"><b>${ok?"صحيح ✓":"الإجابة الصحيحة:"}</b> ${ok?"":esc(toAr(answer))}</div><button onclick="nextQ()">التالي</button>`;document.querySelectorAll(".answer,#ans,.inputrow button").forEach(x=>x.disabled=true)}
window.showReference=function(){const q=session.questions[session.index];$("#ref").classList.remove("hidden");$("#ref").innerHTML=`<b>إجابة مرجعية:</b><p>${esc(q.answer)}</p><div class="row"><button onclick="selfGrade(true)">أجبت بشكل صحيح</button><button class="secondary" onclick="selfGrade(false)">أحتاج مراجعة</button></div>`}
window.selfGrade=function(ok){const q=session.questions[session.index];rec(q,ok,document.querySelector("#writtenReference")?.value||"لم تُكتب إجابة؛ تقييم ذاتي");nextQ()}
window.nextQ=function(){session.index++;if(session.index>=session.questions.length)return finish();renderQ()}
function finish(){const p=Math.round(100*session.score/Math.max(1,session.graded));state.history.push({date:Date.now(),title:session.title,score:session.score,total:session.graded});save();shell(`<section class="card result"><h2>النتيجة</h2><div class="big">${toAr(session.score)} / ${toAr(session.graded)}</div><div class="score">${toAr(p)}٪</div><button onclick="home()">العودة للرئيسية</button></section>`,"النتيجة")}
window.bank=function(subj){const a=eligible(subj),g={};a.forEach(q=>g[q.lesson]=(g[q.lesson]||0)+1);shell(`<section class="card"><h3>${subj==="math"?"مصادر أسئلة الرياضيات":"English Question Sources"}</h3>${Object.entries(g).map(([k,v])=>`<div class="bankrow"><span>${esc(k)}</span><b>${subj==="math"?toAr(v):v}</b></div>`).join("")||"<p>لا توجد أسئلة مفهرسة.</p>"}<p class="muted">كل سؤال يعرض رقم الصفحة ورقم السؤال الأصلي.</p></section>`,"بنك المصدر")}

function syncUnifiedBookScope(){
 const cat=STUDY_CONTEXT.catalog.filter(x=>x.track==='g5');
 const order=x=>x.term*1000000+x.unitOrder*1000+x.lessonOrder;
 const aliases={'القسمة والكسور الاعتيادية':'القسمة والكسور الاعتيادية','الكسور غير الفعلية':'الكسور غير الفعلية والأعداد الكسرية'};
 const permitted=mathScope.filter(([page,title])=>{const x=cat.find(x=>x.subject==='الرياضيات'&&(x.lesson===title||x.lesson===aliases[title]));return x&&order(x)<=Number(STUDY_CONTEXT.scope['الرياضيات']||0)});
 state.mathScope=permitted.length?Math.max(...permitted.map(x=>x[0])):0;
 const eng=Number(STUDY_CONTEXT.scope['الإنجليزي']||0);
 const pageOrders={4:1001001,9:1001001,12:1001002,14:1001003,17:1001005,18:1001006,21:1001007};
 state.englishScope=Math.max(0,...englishScope.filter(([p])=>{const ix=englishScope.findIndex(x=>x[0]===p);const ord=pageOrders[p]||(p<=46?1000000:2000000)+(Math.floor((p-22)/12)+2)*1000+1;return ord<=eng}).map(x=>x[0]));
 save();
}
const originalBookHome=window.home;
window.home=function(){const mode=new URLSearchParams(location.search).get('mode');if(mode==='math'||mode==='english'){setup(mode);return}originalBookHome()};
syncUnifiedBookScope();home();
</script>
</body></html>
